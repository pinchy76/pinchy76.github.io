name: Jekyll site CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Use latest version

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'  # Use a version compatible with GitHub Pages
        bundler-cache: true  # Caches gems for faster builds

    - name: Build Jekyll Site
      uses: actions/jekyll-build-pages@v1
      with:
        source: .  # Default Jekyll source directory
        destination: ./_site  # Output directory
      env:
        JEKYLL_GITHUB_TOKEN: ${{ secrets.PINCHTOKEN }}  # Authentication for metadata plugin
        PAGES_REPO_NWO: pinchy76/pinchy76.github.io # Auto-detect repo

    - name: Upload artifact (optional)
      uses: actions/upload-pages-artifact@v1
      with:
        path: ./_site

permissions:
  contents: read
  pages: write
  id-token: write