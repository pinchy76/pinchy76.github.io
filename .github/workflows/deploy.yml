name: Deploy Jekyll Site

on:
  push:
    branches:
      - main  # ✅ Runs when pushing to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # ✅ Use latest version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"  # ✅ Use a compatible Ruby version
          bundler-cache: true  # ✅ Cache dependencies for faster builds

      - name: Build Jekyll Site
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.PINCHTOKEN }}  # ✅ Authenticate metadata
          PAGES_REPO_NWO: pinchy76/pinchy76.github.io  # ✅ Ensure repo name is set
        run: |
          bundle install
          bundle exec jekyll build --future --trace  # ✅ Enable debugging

      - name: Delete old GitHub Pages artifacts
        uses: geekyeggo/delete-artifact@v2  # ✅ Deletes previous "github-pages" artifacts
        with:
          name: github-pages

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v2  # ✅ Uploads for GitHub Pages
        with:
          name: github-pages
          path: ./_site  # ✅ Ensure correct output directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4  # ✅ Official GitHub Pages deploy action