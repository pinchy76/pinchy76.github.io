name: Beautiful Jekyll CI

on: [push, pull_request]

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # ✅ Use latest version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"  # ✅ Use Ruby version compatible with Jekyll
          bundler-cache: true  # ✅ Cache dependencies for faster builds

      - name: Build Jekyll Site
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.PINCHTOKEN }}  # ✅ Authenticate metadata
          PAGES_REPO_NWO: pinchy76/pinchy76.github.io  # ✅ Ensure repo name is passed
        run: |
          bundle install
          bundle exec jekyll build --future --trace  # ✅ Enable debugging